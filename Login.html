<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>KVK TMIS ERP - Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{

      background:#f3f6fa;

      height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

    }

    .login-card{

      width:420px;

      background:#ffffff;

      border-radius:10px;

      box-shadow:0 4px 15px rgba(0,0,0,.15);

      padding:35px;

    }

    h1{

      text-align:center;

      color:#1b5e20;

      margin-bottom:8px;

      font-size:28px;

    }

    h3{

      text-align:center;

      color:#666;

      margin-bottom:30px;

      font-weight:normal;

    }

    label{

      display:block;

      margin-top:15px;

      margin-bottom:5px;

      font-weight:bold;

    }

    input{

      width:100%;

      padding:12px;

      border:1px solid #ccc;

      border-radius:5px;

      font-size:15px;

    }

    button{

      width:100%;

      margin-top:25px;

      padding:12px;

      background:#2e7d32;

      color:white;

      border:none;

      border-radius:5px;

      cursor:pointer;

      font-size:16px;

    }

    button:hover{

      background:#1b5e20;

    }

    #message{

      margin-top:20px;

      text-align:center;

      font-weight:bold;

    }

    .footer{

      margin-top:30px;

      text-align:center;

      color:#888;

      font-size:12px;

    }

  </style>

</head>

<body>

<div class="login-card">

<h1>KVK TMIS ERP</h1>

<h3>Krishi Vigyan Kendra, Tinsukia</h3>

<label>

Username / Email

</label>

<input
       id="username"
       type="text"
       autocomplete="username">

<label>

Password

</label>

<input
       id="password"
       type="password"
       autocomplete="current-password">

<button onclick="loginUser()">

Login

</button>

<div id="message"></div>

<div class="footer">

Version 1.0

</div>

</div>

<script>

function loginUser(){

    const username =
      document
      .getElementById("username")
      .value
      .trim();

    const password =
      document
      .getElementById("password")
      .value;

    document.getElementById("message").innerHTML =
      "Authenticating...";

    google.script.run

      .withSuccessHandler(function(result){

          if(result.success){

              document.getElementById("message").style.color="green";

              document.getElementById("message").innerHTML=result.message;

              setTimeout(function () {

    alert(
        "Login Successful!\n\n" +
        "User : " + result.data.user.FullName + "\n" +
        "Role : " + result.data.user.Role
    );

},700);

          }
          else{

              document.getElementById("message").style.color="red";

              document.getElementById("message").innerHTML=result.message;

          }

      })

      .withFailureHandler(function(error){

          document.getElementById("message").style.color="red";

          document.getElementById("message").innerHTML=
            error.message;

      })

      .login(username,password);

}

document.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        loginUser();

    }

});

</script>

</body>

</html>
